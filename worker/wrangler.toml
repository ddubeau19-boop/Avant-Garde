name = "vigies"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

[[d1_databases]]
binding = "DB"
database_name = "stratege-fp"
database_id = "a409a728-53d2-4344-b438-6adb9f8b5a46"

# La base du CRM Stratégis, où les factures des syndicats gérés sont déjà
# rattachées à un code de composante. Lue, jamais écrite : le worker n'émet que
# des SELECT dessus. L'accès est réservé à l'entreprise nommée par
# CRM_COMPANY_ID — une firme locataire ne doit pas atteindre les factures d'une
# autre, binding ou pas.
[[d1_databases]]
binding = "CRM"
database_name = "stratege-crm"
database_id = "9bcbc6e3-574a-44f5-8d30-273906128282"

[vars]
CRM_COMPANY_ID = "com_980c47a26e91493593a8"
# Adresse d'expédition des courriels (invitations, mots de passe). Tout
# alias du domaine intégré à Email Service convient, sans boîte à créer.
COURRIEL_EXPEDITEUR = "no-reply@stratege.io"
# Adresse publique de la plateforme, pour les liens des rappels mensuels
# (envoyés sans requête entrante, donc sans adresse à reprendre).
URL_PLATEFORME = "https://pga.stratege.io"

# Cloudflare Email Service : envoi des invitations et des liens de
# réinitialisation. Le domaine stratege.io y est intégré (Email Sending).
[[send_email]]
name = "EMAIL"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "stratege-fp-photos"

[[routes]]
pattern = "pga.stratege.io"
custom_domain = true

# Rappels du carnet d'entretien aux membres des portails : le 1er de chaque
# mois, 11 h UTC (7 h à Montréal l'été, 6 h l'hiver).
[triggers]
crons = ["0 11 1 * *"]

[observability]
enabled = true
